name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      # The tests use their own database on it, passkeys_kit_test.
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The example first: analyzing the package also analyzes example/.
      - name: Get packages
        run: |
          (cd flutter/example && flutter pub get)
          (cd flutter && flutter pub get)
      - name: Check formatting
        working-directory: flutter
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test
      # Infos don't fail the build: newer Flutter releases deprecate APIs the
      # kit still supports on older ones (3.50 deprecates
      # package:flutter/material.dart). They still show in the log, and
      # warnings and errors still fail it.
      - name: Analyze
        working-directory: flutter
        run: flutter analyze --no-fatal-infos
      - name: Test the package
        working-directory: flutter
        run: flutter test
      - name: Test the example
        working-directory: flutter/example
        run: flutter test
